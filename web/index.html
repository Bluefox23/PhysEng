
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Interactive Physics Engine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #14161e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            background: #202431;
            padding: 30px;
        }

        h1 {
            color: #60a5fa;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        canvas {
            display: block;
            width: 100%;
            background: #202431;
            border: 2px solid #374151;
            border-radius: 12px;
        }

        footer {
            padding: 30px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

<header>
    <h1>Interactive Physics Engine</h1>

</header>

<main>

    <canvas id="physicsCanvas"
            width="1000"
            height="700">
    </canvas>

    <p>Physics simulation.</p>

</main>

</body>
</html>
